<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>


           body{
            background: #014430;
           }
          .banner{
            width: 100%;
            height: 100vh;
            text-align: center;
            overflow: hidden;
            position: relative;

          }
          .banner .slider{
            position: absolute;
            width: 200px;
            height: 250px;
            top: 10%;
            left: calc(50% - 100Px);
            transform-style: preserve-3d;
            transform: perspective(900px);
            animation: run 40s linear infinite;
          }

          .banner .slider:hover{ animation-play-state: paused ;}

          @keyframes run {
              from{
                     transform: perspective(900px) rotateX(-7deg) rotateY(0deg);
              }
              to{
                     transform: perspective(900px) rotateX(-7deg) rotateY(360deg);
              }
          }


          .banner .slider .item{
            position: absolute;
            inset: 0 0 0;
            border-radius: 50px 50px 5px 5px;
            overflow: hidden;
            background-color: rgb(178, 209, 178);
            transform: 
                rotateY( calc( (var(--position) - 1 ) * (360 / var(--quantity)) * 1deg ) ) 
               translateZ(500px);
           

           
          }
          .banner .slider .item img{
            
            object-fit: cover;
          }

          img{
            width: 200px;
            height: 250px;
            
          }

          button{
            padding: 1rem 2rem;
            border-radius: 1rem;
            border: 3px solid orangered;
            background: transparent;
            margin-bottom: 2rem;
            transform: translateY(-5rem);
            

          }
          button:focus , button:hover{
             box-shadow: 0 0 20px orangered;
             outline: none;
             
           }
            button a {
              text-decoration: none;
              font-weight: bold;
              color: #000;

            }
    </style>
</head>
<body>
  
   
  
     <div class="banner">
      <div class="slider" style="--quantity : 10">
        <div class="item" style="--position : 1"><img src="Art Gallery/001.png" alt=""></div>
        <div class="item" style="--position : 2"><img src="Art Gallery/nuage.png" alt=""></div>
        <div class="item" style="--position : 3"><img src="Art Gallery/Untitled320_20231211211756.png" alt=""></div>
        <div class="item" style="--position : 4"><img src="Art Gallery/Untitled1106.png" alt=""></div>
        <div class="item" style="--position : 5"><img src="Art Gallery/Untitled1157.png" alt=""></div>
        <div class="item" style="--position : 6"><img src="Art Gallery/Untitled877.png" alt=""></div>
        <div class="item" style="--position : 7"><img src="Art Gallery/Untitled1092_20241229104404.png" alt=""></div>
        <div class="item" style="--position : 8"><img src="Art Gallery/Untitled963.png" alt=""></div>
        <div class="item" style="--position : 9"><img src="Art Gallery/002.png" alt=""></div>
        <div class="item" style="--position : 10"><img src="Art Gallery/Untitled877.png" alt=""></div>
          
      </div>  
    </div>
     <button><a href="index.html">BACK</a></button>
</body>
</html>
